<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Instrument</title>
  </head>
  <body>
    <div id="app">
      <video id="video" playsinline muted></video>
      <canvas id="view"></canvas>
      <div id="hud">
        <div id="status"></div>
        <div id="hint"></div>
        <div id="sam-status"></div>
        <div id="layout-status"></div>
        <div id="tap-cal-status"></div>
        <div id="sam-actions" hidden>
          <button id="accept" type="button">Accept corners</button>
          <button id="retry" type="button">Retry</button>
          <button id="discard" type="button">Discard</button>
        </div>
      </div>
      <div id="toolbar">
        <select id="layout" aria-label="Instrument"></select>
        <input id="instrument" type="text" aria-label="Instrument to generate" spellcheck="false" />
        <button id="generate" type="button">Generate</button>
        <button id="talk" type="button" title="Hold Space or hold this button and say an instrument">Hold to talk</button>
        <select id="tap-mode" aria-label="What triggers a tap">
          <option value="hybrid">Mic + motion</option>
          <option value="vision">Vision only</option>
        </select>
        <select id="fingers" aria-label="Fingers that can tap">
          <option value="index">Index fingers only</option>
          <option value="all">All fingers</option>
        </select>
        <input id="sam-prompt" type="text" aria-label="Surface to detect" spellcheck="false" />
        <button id="detect" type="button">Detect surface</button>
        <button id="reset" type="button">Reset corners</button>
        <button id="test" type="button">Test</button>
        <button id="cal-taps" type="button">Calibrate taps</button>
        <button id="clear-correction" type="button" disabled>Clear correction</button>
      </div>
      <div id="debug">
        <button id="mic" type="button">Enable mic</button>
        <div id="output-latency" hidden></div>
        <div id="camera-warning" hidden></div>
        <div id="test-panel" hidden>
          <div id="test-stats"></div>
          <button id="reset-stats" type="button">Reset stats</button>
        </div>
        <div class="meter">
          <div id="meter-level"></div>
          <div id="meter-threshold"></div>
        </div>
        <dl>
          <dt>Mic level</dt>
          <dd id="mic-level">–</dd>
          <dt>Floor</dt>
          <dd id="mic-floor">–</dd>
          <dt>Threshold</dt>
          <dd id="mic-threshold">–</dd>
          <dt>Chosen finger</dt>
          <dd id="chosen-finger">–</dd>
          <dt>Tap → sound</dt>
          <dd id="tap-latency">–</dd>
          <dt>Median tap → sound</dt>
          <dd id="median-latency">–</dd>
          <dt>Vision tap → sound</dt>
          <dd id="vision-latency">–</dd>
          <dt>Stop offset</dt>
          <dd id="stop-offset">–</dd>
          <dt>Median stop</dt>
          <dd id="median-offset">–</dd>
          <dt>Player edge</dt>
          <dd id="player-edge">–</dd>
          <dt>Camera</dt>
          <dd id="camera-info">–</dd>
          <dt>Camera probe</dt>
          <dd><span id="camera-probe">not run</span> <button id="probe-camera" type="button">Probe</button></dd>
          <dt>Detection</dt>
          <dd id="detection">–</dd>
          <dt>Dropouts</dt>
          <dd><div id="dropouts"></div></dd>
          <dt>Tap correction</dt>
          <dd id="tap-correction">–</dd>
          <dt>Audio latency</dt>
          <dd id="audio-latency">–</dd>
        </dl>
        <ol id="tap-log"></ol>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
