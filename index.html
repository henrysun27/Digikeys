<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Instrument</title>
  </head>
  <body>
    <div id="app">
      <video id="video" playsinline muted></video>
      <canvas id="view"></canvas>
      <div id="hud">
        <div id="status"></div>
        <div id="hint"></div>
      </div>
      <button id="reset" type="button">Reset corners</button>
      <div id="debug">
        <button id="mic" type="button">Enable mic</button>
        <div class="meter">
          <div id="meter-level"></div>
          <div id="meter-threshold"></div>
        </div>
        <dl>
          <dt>Mic level</dt>
          <dd id="mic-level">–</dd>
          <dt>Floor</dt>
          <dd id="mic-floor">–</dd>
          <dt>Threshold</dt>
          <dd id="mic-threshold">–</dd>
          <dt>Chosen finger</dt>
          <dd id="chosen-finger">–</dd>
          <dt>Stop offset</dt>
          <dd id="stop-offset">–</dd>
        </dl>
        <ol id="tap-log"></ol>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
